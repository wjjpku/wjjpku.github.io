<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="Grokking experiment setup with held-out operand pairs and four model families"><rect width="720" height="480" fill="#edece3"/><style>text{font-family:Arial,sans-serif;fill:#303c32}.small{font-size:19px;fill:#65735e}.label{font-size:23px}.title{font-family:Georgia,serif;font-size:32px}.line{fill:none;stroke:#8b9c7b;stroke-width:2}</style><text x="34" y="45" class="title">When does memorization generalize?</text><text x="34" y="78" class="small">Algorithmic tasks with exact answers</text><rect x="34" y="116" width="652" height="78" rx="6" fill="#faf8f1" stroke="#c2ccba"/><text x="66" y="165" class="label">23  +  81  =  ?     (mod 97)</text><text x="522" y="165" class="label">Answer: 7</text><rect x="34" y="222" width="304" height="92" rx="6" fill="#faf8f1" stroke="#c2ccba"/><text x="54" y="260" class="label">Observed operand pairs</text><text x="54" y="290" class="small">Training split</text><rect x="382" y="222" width="304" height="92" rx="6" fill="#faf8f1" stroke="#c2ccba"/><text x="402" y="260" class="label">Unseen operand pairs</text><text x="402" y="290" class="small">Validation split</text><text x="34" y="357" class="small">One training interface · four model families</text><rect x="34" y="379" width="152" height="45" rx="6" fill="#faf8f1" stroke="#c2ccba"/><text x="44" y="408" class="small">Transformer</text><rect x="201" y="379" width="152" height="45" rx="6" fill="#faf8f1" stroke="#c2ccba"/><text x="211" y="408" class="small">MLP</text><rect x="368" y="379" width="152" height="45" rx="6" fill="#faf8f1" stroke="#c2ccba"/><text x="378" y="408" class="small">LSTM</text><rect x="535" y="379" width="152" height="45" rx="6" fill="#faf8f1" stroke="#c2ccba"/><text x="545" y="408" class="small">GRU</text><text x="34" y="458" class="small">Experiment design schematic · not a measured learning curve</text></svg>