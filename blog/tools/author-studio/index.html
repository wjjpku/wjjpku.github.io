<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Author Studio</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --line: #d8dee9;
      --main: #2563eb;
      --soft: #eef4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 18px 0;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 650;
    }

    .tab.active {
      border-color: var(--main);
      background: var(--soft);
      color: var(--main);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: block;
      margin: 0 0 14px;
      font-weight: 650;
    }

    .hint {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
    }

    input,
    textarea {
      width: 100%;
      margin-top: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      font: inherit;
      color: var(--text);
      background: color-mix(in srgb, var(--panel) 92%, var(--bg));
    }

    textarea {
      min-height: 320px;
      resize: vertical;
      line-height: 1.65;
    }

    input[type="file"] {
      padding: 9px;
    }

    button.primary,
    button.secondary {
      border: 0;
      border-radius: 8px;
      padding: 11px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      background: var(--main);
      color: white;
    }

    button.secondary {
      background: var(--soft);
      color: var(--main);
      border: 1px solid color-mix(in srgb, var(--main) 35%, var(--line));
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #101827;
      color: #dbeafe;
      min-height: 340px;
      max-height: 560px;
      overflow: auto;
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 860px) {
      .grid,
      .row {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>Author Studio</h1>
        <p>本地写作入口：生成感想、笔记，或把生活照片加入照片墙。它只写入本机仓库文件，不会暴露线上写入接口。</p>
      </div>
      <div class="actions">
        <button class="secondary" data-run="build">构建检查</button>
        <button class="secondary" data-run="deploy">部署网站</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="thought">最近感想</button>
      <button class="tab" data-tab="note">笔记</button>
      <button class="tab" data-tab="photos">生活照片</button>
    </div>

    <div class="grid">
      <main class="panel">
        <form class="form active" id="thought-form">
          <div class="row">
            <label>标题
              <input name="title" required placeholder="例如：今天在燕园想到的一件事">
            </label>
            <label>日期
              <input name="date" type="datetime-local">
            </label>
          </div>
          <div class="row">
            <label>文件名
              <input name="slug" placeholder="留空则自动用标题生成">
              <span class="hint">会保存到 source/_posts/文件名.md</span>
            </label>
            <label>标签
              <input name="tags" value="随笔" placeholder="用逗号分隔">
            </label>
          </div>
          <label>分类
            <input name="categories" value="日常" placeholder="用逗号分隔">
          </label>
          <label>图片
            <input name="images" type="file" accept="image/*" multiple>
            <span class="hint">第一张会自动作为封面，图片会以普通 Markdown 插入文首。</span>
          </label>
          <label>正文
            <textarea name="content" required placeholder="直接写 Markdown。"></textarea>
          </label>
          <button class="primary" type="submit">保存感想文章</button>
        </form>

        <form class="form" id="note-form">
          <div class="row">
            <label>标题
              <input name="title" required placeholder="例如：实分析的一点整理">
            </label>
            <label>日期
              <input name="date" type="datetime-local">
            </label>
          </div>
          <div class="row">
            <label>文件名
              <input name="slug" placeholder="留空则自动用标题生成">
            </label>
            <label>标签
              <input name="tags" value="笔记" placeholder="用逗号分隔">
            </label>
          </div>
          <label>分类
            <input name="categories" value="笔记" placeholder="用逗号分隔">
          </label>
          <label>图片
            <input name="images" type="file" accept="image/*" multiple>
          </label>
          <label>正文
            <textarea name="content" required placeholder="直接写 Markdown，可以放公式、列表、代码块。"></textarea>
          </label>
          <button class="primary" type="submit">保存笔记文章</button>
        </form>

        <form class="form" id="photos-form">
          <div class="row">
            <label>日期
              <input name="date" type="date">
            </label>
            <label>照片说明
              <input name="caption" placeholder="可空；照片不会生成文章或 note">
            </label>
          </div>
          <label>替代文本
            <input name="alt" placeholder="可空；用于图片 alt">
          </label>
          <label>照片
            <input name="images" type="file" accept="image/*" multiple required>
            <span class="hint">只加入 source/photos/photos.json 和 source/photos/，不会创建 Markdown 文章。</span>
          </label>
          <button class="primary" type="submit">添加到生活照片</button>
        </form>
      </main>

      <aside class="panel">
        <p>操作日志</p>
        <pre id="log">等待操作...</pre>
      </aside>
    </div>
  </div>

  <script>
    const logEl = document.getElementById('log');

    function log(message) {
      logEl.textContent = typeof message === 'string' ? message : JSON.stringify(message, null, 2);
    }

    document.querySelectorAll('.tab').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));
        document.querySelectorAll('.form').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        document.getElementById(`${button.dataset.tab}-form`).classList.add('active');
      });
    });

    async function fileToData(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ name: file.name, type: file.type, dataUrl: reader.result });
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function files(input) {
      return Promise.all([...input.files].map(fileToData));
    }

    async function postJson(url, payload) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || '操作失败');
      return data;
    }

    async function submitPost(event, kind) {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = {
        kind,
        title: form.title.value,
        date: form.date.value,
        slug: form.slug.value,
        tags: form.tags.value,
        categories: form.categories.value,
        content: form.content.value,
        images: await files(form.images)
      };
      log('正在保存...');
      const result = await postJson('/api/post', payload);
      log(result);
      form.reset();
      if (kind === 'thought') {
        form.tags.value = '随笔';
        form.categories.value = '日常';
      } else {
        form.tags.value = '笔记';
        form.categories.value = '笔记';
      }
    }

    async function submitPhotos(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = {
        date: form.date.value,
        caption: form.caption.value,
        alt: form.alt.value,
        images: await files(form.images)
      };
      log('正在保存照片...');
      const result = await postJson('/api/photos', payload);
      log(result);
      form.reset();
    }

    document.getElementById('thought-form').addEventListener('submit', event => submitPost(event, 'thought').catch(error => log(error.message)));
    document.getElementById('note-form').addEventListener('submit', event => submitPost(event, 'note').catch(error => log(error.message)));
    document.getElementById('photos-form').addEventListener('submit', event => submitPhotos(event).catch(error => log(error.message)));

    document.querySelectorAll('[data-run]').forEach(button => {
      button.addEventListener('click', async () => {
        const action = button.dataset.run;
        log(action === 'build' ? '正在构建检查...' : '正在部署...');
        try {
          const result = await postJson('/api/run', { action });
          log(result.result.output);
        } catch (error) {
          log(error.message);
        }
      });
    });
  </script>
</body>
</html>
