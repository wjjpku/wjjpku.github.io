- class_name: 学术工作
  description: 项目与实验
  tip: 四个项目分别落在训练曲线建模、算法数据集泛化、数学文本来源识别和交互叙事上；这里保留研究问题、方法证据和可追溯的代码入口。
  top_background: /photos/all.jpg
  good_things:
    - title: 公开项目
      description: 从损失曲线、代数结构学习到数学文本检测和聊天式经营游戏，展示我近期做过的几类完整项目。
      equipment_list:
        - name: DLfinal
          specification: Loss Curve Transfer / Schedule Response
          description: 从公开 cosine loss curve 中识别可迁移的学习率下降响应，在不读取目标 WSD loss 的前提下改进 MPL baseline。
          image: https://raw.githubusercontent.com/wjjpku/DL-final/main/slides/figs/fig_projection_decomposition_cosine_100M.png
          link: /projects/dl-final/
        - name: MLfinal
          specification: Grokking / Algorithmic Datasets
          description: 把模运算、S5 群运算和 K 元求和写成短序列预测任务，比较 Transformer、MLP、LSTM 等模型的延迟泛化。
          image: https://raw.githubusercontent.com/wjjpku/ML-final/main/assets/grokking_accuracy_curves.png
          link: /projects/ml-final/
        - name: Modelmid
          specification: Math Text Attribution / Adversarial Detection
          description: 识别人类与 DeepSeek、GLM、GPT、Kimi、Qwen 等模型生成的数学解答，并分析跨语言泛化和防检测提示。
          image: https://raw.githubusercontent.com/wjjpku/Modelmid/main/docs/figures/gpt_augmented/pca_clusters_2d.png
          link: /projects/modelmid/
        - name: 鸭腿叔叔
          specification: Interactive Fiction / Chat-Based Business Game
          description: 用微信式聊天界面承载经营决策、群聊舆论、供应商风险和多结局复盘，让读消息本身成为玩法。
          image: https://raw.githubusercontent.com/wjjpku/UncleDucky/main/assets/duck-leg-uncle-avatar.png
          link: /projects/uncle-ducky/
